name: Build fast TV launcher

on:
  push:
    paths:
      - 'tv-launcher/**'
      - '.github/workflows/build-tv-launcher.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build launcher
        run: gradle -p tv-launcher assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp tv-launcher/app/build/outputs/apk/debug/app-debug.apk fast-tv-launcher.apk
          ls -lh fast-tv-launcher.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-tv-launcher
          path: fast-tv-launcher.apk
          if-no-files-found: error

      - name: Publish launcher in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-launcher-v1
          name: Быстрый лаунчер для Android TV
          body: |
            Лёгкий лаунчер для Android TV / Android Box.

            - нативный APK без тяжёлых библиотек — открывается мгновенно;
            - крупные скруглённые плитки, удобно с пульта;
            - поиск приложений по названию, избранное (долгое нажатие);
            - можно выбрать домашним экраном через HOME-intent;
            - тёмная тема, часы, кнопка настроек.

            Установка: скачай APK, разреши установку из неизвестных источников,
            затем в настройках TV выбери этот лаунчер как домашний экран.
          files: fast-tv-launcher.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
