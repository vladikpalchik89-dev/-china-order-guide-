plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fastlauncher'
    compileSdk 35

    defaultConfig {
        applicationId "com.fastlauncher"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
            debuggable false
        }
    }
}
